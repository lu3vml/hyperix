source = ~/.config/hyprix/current/hyprlock.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = $wallpaper
    color = $bg
    blur_passes = 3
    blur_size = 7
    brightness = 0.55
    vibrancy = 0.2
}

label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 64
    font_family = $font_ui
    position = 0, 110
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %d de %B"
    color = $muted
    font_size = 12
    font_family = $font_ui
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 42
    outline_thickness = 1
    rounding = 0
    outer_color = $accent
    inner_color = $bg
    font_color = $fg
    font_family = $font_mono
    check_color = $accent
    fail_color = $urgent
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.4
    placeholder_text = contraseña
    fail_text = incorrecta ($ATTEMPTS)
    position = 0, -40
    halign = center
    valign = center
}
