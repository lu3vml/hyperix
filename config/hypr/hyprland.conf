# =============================================================
#  HYPRIX — config principal de Hyprland
#  Tus cambios personales van en ~/.config/hypr/user.conf
#  (este archivo puede regenerarse al reinstalar)
# =============================================================
source = ~/.config/hyprix/current/hyprland.conf

monitor = ,preferred,auto,1

# ---------- Entorno ----------
env = QT_QPA_PLATFORMTHEME,gtk3
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# ---------- Autostart ----------
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user start hyprpolkitagent
exec-once = ~/.local/bin/hyprix-bar start
exec-once = swayosd-server
exec-once = mako
exec-once = hypridle
exec-once = ~/.local/bin/hyprix-bg
exec-once = wl-paste --watch cliphist store
exec-once = ~/.local/bin/hyprix-daemon
exec-once = udiskie

# ---------- Entrada ----------
# teclado, trackpad y puntero: los genera hyprix-config en looknfeel.conf
gesture = 3, horizontal, workspace

source = ~/.config/hypr/looknfeel.conf    # generado por hyprix-config
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/workflow.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/user.conf
