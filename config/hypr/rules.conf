# =============================================================
#  HYPRIX — reglas de ventanas (sintaxis Hyprland 0.53+)
#  Para saber la clase de una ventana:  hyprctl clients
# =============================================================

# Terminales emergentes de HYPRIX (red, actualizar, etc.)
windowrule = match:class ^(hyprix-float)$, float on
windowrule = match:class ^(hyprix-float)$, size 860 560
windowrule = match:class ^(hyprix-float)$, center on

# Audio
windowrule = match:class ^(org.pulseaudio.pavucontrol|pavucontrol)$, float on
windowrule = match:class ^(org.pulseaudio.pavucontrol|pavucontrol)$, size 780 520
windowrule = match:class ^(org.pulseaudio.pavucontrol|pavucontrol)$, center on

# Bluetooth y red
windowrule = match:class ^(\.?blueman-manager.*)$, float on
windowrule = match:class ^(\.?blueman-manager.*)$, size 700 500
windowrule = match:class ^(\.?blueman-manager.*)$, center on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(nm-connection-editor)$, center on

# Selectores de archivos y diálogos
windowrule = match:class ^(xdg-desktop-portal-gtk)$, float on
windowrule = match:class ^(xdg-desktop-portal-gtk)$, center on
windowrule = match:title ^(Open File|Open Files|Open Folder|Save As|Save File|Abrir archivo|Abrir archivos|Abrir carpeta|Guardar como|Guardar archivo|Subir archivo|File Upload).*$, float on
windowrule = match:title ^(Open File|Open Files|Open Folder|Save As|Save File|Abrir archivo|Abrir archivos|Abrir carpeta|Guardar como|Guardar archivo|Subir archivo|File Upload).*$, center on
windowrule = match:class ^(thunar|Thunar)$, match:title ^(File Operation Progress|Progreso de la operación.*|Rename.*|Renombrar.*)$, float on

# Imágenes y video
windowrule = match:class ^(imv)$, float on
windowrule = match:class ^(imv)$, center on
windowrule = match:title ^(HYPRIX · Fondos).*$, size 80% 80%
windowrule = match:class ^(mpv)$, float on
windowrule = match:class ^(mpv)$, center on

# Picture-in-Picture de Firefox: flotante y fijo en todos los escritorios
windowrule = match:title ^(Picture-in-Picture|Imagen en imagen)$, float on
windowrule = match:title ^(Picture-in-Picture|Imagen en imagen)$, pin on
windowrule = match:title ^(Picture-in-Picture|Imagen en imagen)$, size 480 270

# Terminal del scratchpad
windowrule = match:class ^(hyprix-scratch)$, float on
windowrule = match:class ^(hyprix-scratch)$, size 75% 70%
windowrule = match:class ^(hyprix-scratch)$, center on

# Editor de capturas
windowrule = match:class ^(swappy)$, float on
windowrule = match:class ^(swappy)$, center on
