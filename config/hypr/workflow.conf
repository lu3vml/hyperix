# =============================================================
#  HYPRIX — flujo de trabajo (scratchpad, grupos, gestos, capas)
# =============================================================
$mod = SUPER

# ---------- Scratchpad: terminal flotante siempre a mano ----------
workspace = special:scratch, on-created-empty:foot --app-id=hyprix-scratch, gapsout:40
bind = $mod, S, togglespecialworkspace, scratch              # Scratchpad
bind = $mod ALT, S, movetoworkspace, special:scratch         # Mandar ventana al scratchpad
gesture = 3, up, special, scratch
gesture = 3, down, special, scratch

# ---------- Alt+Tab ----------
bind = ALT, TAB, cyclenext                                   # Ventana siguiente
bind = ALT, TAB, bringactivetotop
bind = ALT SHIFT, TAB, cyclenext, prev                       # Ventana anterior
bind = ALT SHIFT, TAB, bringactivetotop

# ---------- Grupos con pestañas ----------
bind = $mod, G, togglegroup                                  # Agrupar / desagrupar
bind = $mod ALT, G, moveoutofgroup                           # Sacar ventana del grupo
bind = $mod CTRL, TAB, changegroupactive, f                  # Pestaña siguiente del grupo
bind = $mod CTRL SHIFT, TAB, changegroupactive, b            # Pestaña anterior del grupo
bind = $mod CTRL, LEFT, moveintogroup, l                     # Meter en grupo de la izquierda
bind = $mod CTRL, RIGHT, moveintogroup, r                    # Meter en grupo de la derecha
bind = $mod CTRL, UP, moveintogroup, u                       # Meter en grupo de arriba
bind = $mod CTRL, DOWN, moveintogroup, d                     # Meter en grupo de abajo

group {
    col.border_active = $active
    col.border_inactive = $inactive
    groupbar {
        font_family = JetBrainsMono Nerd Font
        font_size = 9
        height = 14
        gradients = false
        render_titles = true
    }
}

# ---------- Layout ----------
bind = $mod, L, exec, ~/.local/bin/hyprix-layout             # Alternar dwindle / master
bind = $mod, J, layoutmsg, togglesplit                       # Rotar división (dwindle)

master {
    new_status = slave
    mfact = 0.58
}

# ---------- Modo resize: Super+R, flechas, Esc/Enter para salir ----------
bind = $mod, R, submap, resize                               # Modo redimensionar
submap = resize
binde = , RIGHT, resizeactive, 30 0
binde = , LEFT, resizeactive, -30 0
binde = , UP, resizeactive, 0 -30
binde = , DOWN, resizeactive, 0 30
bind = , ESCAPE, submap, reset
bind = , RETURN, submap, reset
submap = reset

# ---------- Blur detrás de barra, lanzador y notificaciones ----------
layerrule = match:namespace ^(waybar)$, blur on
layerrule = match:namespace ^(waybar)$, ignore_alpha 0.2
layerrule = match:namespace ^(launcher)$, blur on
layerrule = match:namespace ^(launcher)$, ignore_alpha 0.2
layerrule = match:namespace ^(notifications)$, blur on
layerrule = match:namespace ^(notifications)$, ignore_alpha 0.2

# ---------- Varios ----------
misc {
    enable_swallow = true
    swallow_regex = ^(foot)$
    key_press_enables_dpms = true
    mouse_move_enables_dpms = true
    focus_on_activate = true
}
