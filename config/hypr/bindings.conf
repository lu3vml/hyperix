# =============================================================
#  HYPRIX — atajos (Super = tecla Cmd ⌘)
#  Lo que va después de "#" aparece en la ayuda (Super+K)
# =============================================================
$mod = SUPER

# ---------- Apps ----------
bind = $mod, RETURN, exec, foot                              # Terminal
bind = $mod, SPACE, exec, ~/.local/bin/hyprix-run                  # Lanzador (=calc /archivos !cmd ?web)
bind = $mod ALT, SPACE, exec, ~/.local/bin/hyprix-menu       # Menú HYPRIX
bind = $mod, comma, exec, ~/.local/bin/hyprix-config               # Configuración
bind = $mod, ESCAPE, exec, ~/.local/bin/hyprix-menu power    # Menú de energía
bind = $mod, K, exec, ~/.local/bin/hyprix-keys               # Ayuda de atajos
bind = $mod, B, exec, ~/.local/bin/hyprix-app browser        # Navegador
bind = $mod, E, exec, ~/.local/bin/hyprix-app files          # Archivos
bind = $mod, N, exec, ~/.local/bin/hyprix-app editor         # Editor de terminal
bind = $mod, I, exec, foot -e btop                           # Monitor del sistema
bind = $mod CTRL SHIFT, SPACE, exec, ~/.local/bin/hyprix-theme --menu   # Cambiar tema
bind = $mod CTRL, SPACE, exec, ~/.local/bin/hyprix-bg pick              # Elegir fondo (vista previa)
bind = $mod CTRL ALT, SPACE, exec, ~/.local/bin/hyprix-bg next          # Fondo siguiente
bind = $mod CTRL, N, exec, ~/.local/bin/hyprix-nightlight toggle     # Luz nocturna
bind = $mod CTRL, L, exec, loginctl lock-session             # Bloquear
bind = $mod SHIFT, B, exec, ~/.local/bin/hyprix-bar restart   # Reiniciar barra
bind = $mod CTRL, V, exec, cliphist list | fuzzel --dmenu --prompt "Portapapeles › " | cliphist decode | wl-copy   # Historial portapapeles

# ---------- Capturas (la Mac no tiene Print) ----------
bind = $mod SHIFT, S, exec, ~/.local/bin/hyprix-shot region       # Captura de región
bind = $mod CTRL SHIFT, S, exec, ~/.local/bin/hyprix-shot screen  # Captura de pantalla
bind = $mod ALT SHIFT, S, exec, ~/.local/bin/hyprix-shot window  # Captura de ventana
bind = $mod SHIFT, E, exec, ~/.local/bin/hyprix-eject              # Expulsar pendrive/disco

# ---------- Ventanas ----------
bind = $mod, W, killactive                     # Cerrar ventana
bind = $mod, F, fullscreen, 0                  # Pantalla completa
bind = $mod ALT, F, fullscreen, 1              # Maximizar
bind = $mod, T, togglefloating                 # Flotante / mosaico
bind = $mod, LEFT, movefocus, l                # Foco izquierda
bind = $mod, RIGHT, movefocus, r               # Foco derecha
bind = $mod, UP, movefocus, u                  # Foco arriba
bind = $mod, DOWN, movefocus, d                # Foco abajo
bind = $mod SHIFT, LEFT, movewindow, l         # Mover ventana izquierda
bind = $mod SHIFT, RIGHT, movewindow, r        # Mover ventana derecha
bind = $mod SHIFT, UP, movewindow, u           # Mover ventana arriba
bind = $mod SHIFT, DOWN, movewindow, d         # Mover ventana abajo
binde = $mod ALT, LEFT, resizeactive, -40 0    # Achicar ancho
binde = $mod ALT, RIGHT, resizeactive, 40 0    # Agrandar ancho
binde = $mod ALT, UP, resizeactive, 0 -40      # Achicar alto
binde = $mod ALT, DOWN, resizeactive, 0 40     # Agrandar alto
bind = $mod, TAB, workspace, e+1               # Escritorio siguiente
bind = $mod SHIFT, TAB, workspace, e-1         # Escritorio anterior
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ---------- Multimedia / brillo (teclas de la Mac) ----------
bindel = , XF86AudioRaiseVolume, exec, ~/.local/bin/hyprix-osd vol up
bindel = , XF86AudioLowerVolume, exec, ~/.local/bin/hyprix-osd vol down
bindl  = , XF86AudioMute, exec, ~/.local/bin/hyprix-osd vol mute
bindel = , XF86MonBrightnessUp, exec, ~/.local/bin/hyprix-osd bri up
bindel = , XF86MonBrightnessDown, exec, ~/.local/bin/hyprix-osd bri down
bindel = , XF86KbdBrightnessUp, exec, ~/.local/bin/hyprix-osd kbd up
bindel = , XF86KbdBrightnessDown, exec, ~/.local/bin/hyprix-osd kbd down
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous

# ---------- Escritorios 1-9 ----------
bind = $mod, 1, workspace, 1   # Ir a escritorio N (Super+1..9)
bind = $mod SHIFT, 1, movetoworkspace, 1   # Mover ventana a escritorio N
bind = $mod, 2, workspace, 2
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod, 3, workspace, 3
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod, 6, workspace, 6
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod, 7, workspace, 7
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod, 8, workspace, 8
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 9, movetoworkspace, 9
